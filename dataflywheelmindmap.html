<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데이터 플라이휠(Data Flywheel) 연구 지도</title>
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --c-robotics:     #2a78d6;
    --c-driving:      #eb6834;
    --c-agent:        #1baf7a;
    --c-vision:       #eda100;
    --c-llm:          #e87ba4;
    --scrim:          rgba(11,11,11,0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --c-robotics:     #3987e5;
      --c-driving:      #d95926;
      --c-agent:        #199e70;
      --c-vision:       #c98500;
      --c-llm:          #d55181;
      --scrim:          rgba(0,0,0,0.6);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 1260px; margin: 0 auto; padding: 32px 20px 64px; }
  header h1 { font-size: 1.55rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p.sub { margin: 0; color: var(--text-secondary); font-size: 0.95rem; }
  header p.hint { margin: 6px 0 0; color: var(--text-muted); font-size: 0.85rem; }

  /* ---- tabs ---- */
  .tabs { display: flex; gap: 6px; margin-top: 22px; border-bottom: 1px solid var(--grid); }
  .tab-btn {
    background: none; border: none; border-bottom: 3px solid transparent;
    font: inherit; font-weight: 600; font-size: 0.95rem; color: var(--text-secondary);
    padding: 10px 16px 8px; cursor: pointer;
  }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--text-primary); }
  .panel { display: none; margin-top: 16px; }
  .panel.active { display: block; }

  .board {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 14px; padding: 8px;
  }
  svg.big { width: 100%; height: auto; display: block; }
  svg text { font-family: inherit; }
  svg .t-title { font-size: 14.5px; font-weight: 650; fill: var(--text-primary); }
  svg .t-sub   { font-size: 11.5px; fill: var(--text-secondary); }
  svg .t-meta  { font-size: 11px; fill: var(--text-muted); }
  svg .t-branch{ font-size: 14px; font-weight: 700; fill: var(--text-primary); }
  svg .t-center{ font-size: 19px; font-weight: 750; fill: var(--text-primary); }
  svg .t-center-sub{ font-size: 12px; fill: var(--text-secondary); }
  svg g.paper, svg g.gnode { cursor: pointer; }
  svg g.paper:hover rect, svg g.paper:focus-visible rect { stroke-width: 3; }
  svg g.paper:focus-visible, svg g.gnode:focus-visible { outline: none; }
  svg g.gnode:hover circle.core, svg g.gnode:focus-visible circle.core { stroke-width: 4; }

  .legend-row { display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 14px 4px; font-size: 0.82rem; color: var(--text-secondary); align-items: center; }
  .legend-row .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend-row .ln { display: inline-block; width: 26px; height: 0; border-top: 2px solid var(--text-muted); margin-right: 6px; vertical-align: 3px; }
  .legend-row .ln.dash { border-top-style: dashed; }

  /* ---- timeline ---- */
  .timeline { position: relative; padding: 10px 0 10px 30px; margin: 8px 12px; }
  .timeline::before {
    content: ""; position: absolute; left: 9px; top: 0; bottom: 0;
    width: 2px; background: var(--grid);
  }
  .tl-year {
    position: relative; margin: 22px 0 10px; font-size: 1.02rem; font-weight: 750;
  }
  .tl-year::before {
    content: ""; position: absolute; left: -27px; top: 7px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--text-muted);
  }
  .tl-item {
    position: relative; display: flex; gap: 12px; align-items: baseline;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; margin: 8px 0; cursor: pointer;
    width: 100%; text-align: left; font: inherit; color: inherit;
  }
  .tl-item:hover { border-color: var(--text-muted); }
  .tl-item::before {
    content: ""; position: absolute; left: -25px; top: 16px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--dot, var(--text-muted));
  }
  .tl-item .m { color: var(--text-muted); font-size: 0.8rem; min-width: 34px; }
  .tl-item .t { font-weight: 640; font-size: 0.92rem; }
  .tl-item .d { color: var(--text-secondary); font-size: 0.84rem; }
  .tl-item .v { margin-left: auto; color: var(--text-muted); font-size: 0.78rem; white-space: nowrap; }

  /* ---- list ---- */
  section.list { margin-top: 30px; }
  section.list h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .paper-row {
    display: flex; align-items: baseline; gap: 12px; width: 100%;
    text-align: left; background: var(--surface-1);
    border: 1px solid var(--border); border-left: 4px solid var(--bc, var(--baseline));
    border-radius: 10px; padding: 11px 16px; margin-bottom: 8px;
    cursor: pointer; color: inherit; font: inherit;
  }
  .paper-row:hover { border-color: var(--text-muted); border-left-color: var(--bc, var(--baseline)); }
  .paper-row .rt { font-weight: 640; font-size: 0.93rem; }
  .paper-row .rm { color: var(--text-muted); font-size: 0.8rem; margin-left: auto; white-space: nowrap; }

  /* ---- modal ---- */
  .overlay {
    position: fixed; inset: 0; background: var(--scrim);
    display: none; align-items: flex-start; justify-content: center;
    padding: 4vh 16px; z-index: 50; overflow-y: auto;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 16px; max-width: 820px; width: 100%;
    box-shadow: 0 24px 64px rgba(0,0,0,0.28);
  }
  .modal-head { padding: 22px 26px 16px; border-bottom: 1px solid var(--grid); position: relative; }
  .modal-head .tag {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 0.78rem; font-weight: 650; color: var(--text-secondary); margin-bottom: 8px;
  }
  .modal-head .tag .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .modal-head h2 { margin: 0 0 6px; font-size: 1.22rem; line-height: 1.35; letter-spacing: -0.01em; padding-right: 40px; }
  .modal-head .meta { color: var(--text-muted); font-size: 0.85rem; }
  .modal-head .links { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .modal-head .links a {
    display: inline-block; text-decoration: none; font-size: 0.84rem; font-weight: 600;
    color: var(--text-primary); border: 1.5px solid var(--baseline);
    border-radius: 8px; padding: 6px 12px;
  }
  .modal-head .links a:hover { border-color: var(--text-primary); }
  .close-btn {
    position: absolute; top: 16px; right: 16px;
    background: none; border: 1px solid var(--border); border-radius: 8px;
    width: 34px; height: 34px; font-size: 1rem; line-height: 1;
    color: var(--text-secondary); cursor: pointer;
  }
  .close-btn:hover { color: var(--text-primary); border-color: var(--text-muted); }
  .modal-body { padding: 20px 26px 28px; }
  .modal-body h3 {
    font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin: 22px 0 8px; font-weight: 700;
  }
  .modal-body h3:first-child { margin-top: 0; }
  .modal-body p { margin: 0 0 10px; font-size: 0.95rem; }
  .modal-body p.results { color: var(--text-secondary); }
  .metric-box {
    border: 1px solid var(--grid); border-radius: 10px; padding: 12px 16px;
    font-size: 0.9rem; color: var(--text-secondary);
  }
  .metric-box b { color: var(--text-primary); }
  .metric-note { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; }
  .diagram-holder { margin: 12px 0 4px; }
  .diagram-holder svg { width: 100%; height: auto; display: block; }
  .diag-caption { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }

  footer.src { margin-top: 36px; color: var(--text-muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>데이터 플라이휠(Data Flywheel) 연구 지도</h1>
    <p class="sub">비전 데이터 엔진 · LLM 자기개선 · 로보틱스 · 자율주행 · AI 에이전트 — 5개 테마, 주요 논문 15편</p>
    <p class="hint">논문 노드를 클릭하면 요약 · 아키텍처 다이어그램 · 학술 지표(선정 근거) · 원문 링크가 열립니다.</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab-btn" role="tab" id="tab-theme" aria-selected="true" data-panel="panel-theme">테마 지도</button>
    <button class="tab-btn" role="tab" id="tab-time" aria-selected="false" data-panel="panel-time">시간순</button>
    <button class="tab-btn" role="tab" id="tab-graph" aria-selected="false" data-panel="panel-graph">연관성 그래프</button>
  </div>

  <div class="panel active" id="panel-theme" role="tabpanel" aria-labelledby="tab-theme">
    <div class="board">
      <div class="legend-row" id="legend-theme"></div>
      <svg class="big" id="mindmap" viewBox="0 0 1240 870" role="group" aria-label="테마별 논문 마인드맵"></svg>
    </div>
  </div>

  <div class="panel" id="panel-time" role="tabpanel" aria-labelledby="tab-time">
    <div class="board">
      <div class="legend-row" id="legend-time"></div>
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <div class="panel" id="panel-graph" role="tabpanel" aria-labelledby="tab-graph">
    <div class="board">
      <div class="legend-row" id="legend-graph"></div>
      <svg class="big" id="relgraph" viewBox="0 0 1240 760" role="group" aria-label="논문 상호 연관성 그래프"></svg>
    </div>
  </div>

  <section class="list" aria-label="논문 목록">
    <h2>논문 목록 (시간순 텍스트 보기)</h2>
    <div id="paper-list"></div>
  </section>

  <footer class="src" id="foot-note"></footer>
</div>

<!-- modal -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="modal-head">
      <span class="tag"><span class="dot" id="m-dot"></span><span id="m-branch"></span></span>
      <h2 id="m-title"></h2>
      <div class="meta" id="m-meta"></div>
      <div class="links" id="m-links"></div>
      <button class="close-btn" id="m-close" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body">
      <h3>학술 지표 · 주요 논문 선정 근거</h3>
      <div class="metric-box" id="m-metric"></div>
      <h3>요약</h3>
      <p id="m-summary"></p>
      <h3>핵심 아키텍처</h3>
      <p id="m-arch"></p>
      <div class="diagram-holder" id="m-diagram"></div>
      <p class="diag-caption" id="m-caption"></p>
      <h3>주요 결과</h3>
      <p class="results" id="m-results"></p>
    </div>
  </div>
</div>

<script>
/* =========================================================
   데이터
   ========================================================= */
const THEMES = {
  vision:   { label: "비전 데이터 엔진 (개념 기원)", cssVar: "--c-vision"   },
  llm:      { label: "LLM 자기개선 계보",            cssVar: "--c-llm"      },
  robotics: { label: "로보틱스 · Embodied AI",        cssVar: "--c-robotics" },
  driving:  { label: "자율주행",                      cssVar: "--c-driving"  },
  agent:    { label: "AI 에이전트 · 엔터프라이즈",    cssVar: "--c-agent"    }
};

const CITE_NOTE = "인용 수는 Semantic Scholar 기준 근사치(2026년 초). 최신 수치는 각 논문의 'Semantic Scholar' 링크에서 확인하세요.";

const PAPERS = {
  /* ---------- 비전: 데이터 엔진 기원 ---------- */
  "sam": {
    theme: "vision", short: "Segment Anything (SAM)", sub: "3단계 데이터 엔진 · SA-1B",
    title: "Segment Anything",
    date: "2023-04", arxivId: "2304.02643",
    meta: "Kirillov et al. (Meta AI) · ICCV 2023 · arXiv 2304.02643",
    venue: "ICCV 2023",
    citeTier: "10,000+ (분야 최상위)",
    evidence: "'데이터 엔진'을 통한 파운데이션 모델 구축을 대중화한 기념비적 논문. ICCV 2023 게재, 인용 수 만 단위의 초고인용 논문으로 이후 데이터 플라이휠 연구들이 공통적으로 참조하는 개념적 기원.",
    summary: "프롬프트 기반 범용 분할(segmentation) 파운데이션 모델 SAM과, 이를 만들기 위한 '데이터 엔진'을 제안합니다. 모델이 라벨링을 돕고 그 라벨로 모델이 다시 강해지는 모델-인-더-루프 순환으로, 1,100만 이미지에 11억 개 마스크(SA-1B)라는 사상 최대 분할 데이터셋을 구축했습니다.",
    arch: "데이터 엔진은 3단계로 진화합니다. 1단계 보조 수동(assisted-manual)에서는 SAM이 어노테이터의 마스크 작업을 보조하고, 2단계 반자동(semi-automatic)에서는 모델이 확신하는 객체는 자동 생성하고 사람은 나머지만 채우며, 3단계 완전 자동(fully automatic)에서는 포인트 그리드 프롬프트만으로 모델이 마스크를 전부 생성합니다. 각 단계에서 모은 데이터로 모델을 재학습해 다음 단계의 자동화율을 높이는 플라이휠 구조입니다.",
    stages: ["보조 수동 라벨링|모델이 사람을 보조", "반자동 라벨링|잔여 객체만 사람이", "완전 자동 생성|프롬프트 그리드", "모델 재학습|자동화율 상승"],
    center: "SAM\n데이터 엔진",
    results: "SA-1B: 1,100만 이미지 · 11억 마스크(기존 최대 대비 400배). 23개 벤치마크에서 zero-shot 전이 성능이 지도학습 대비 경쟁력 확보.",
    caption: "SAM 데이터 엔진: 라벨링 자동화 단계가 올라갈수록 모델과 데이터가 함께 성장"
  },
  "sam2": {
    theme: "vision", short: "SAM 2", sub: "비디오 데이터 엔진 · SA-V",
    title: "SAM 2: Segment Anything in Images and Videos",
    date: "2024-08", arxivId: "2408.00714",
    meta: "Ravi et al. (Meta AI) · arXiv 2408.00714 · ICLR 2025",
    venue: "ICLR 2025",
    citeTier: "1,000+",
    evidence: "SAM 데이터 엔진을 비디오로 확장한 직계 후속 연구. ICLR 2025 게재, 공개 1년여 만에 인용 1,000회 이상.",
    summary: "이미지·비디오 통합 분할 모델 SAM 2와, 비디오용 모델-인-더-루프 데이터 엔진을 제안합니다. 어노테이터가 모델의 예측을 교정하면 그 데이터로 모델을 재학습하는 순환을 통해 대규모 비디오 분할 데이터셋 SA-V를 구축했습니다.",
    arch: "데이터 엔진은 모델과 어노테이터의 상호작용 루프입니다. SAM 2가 비디오 프레임 전반에 마스클릿(masklet)을 전파·예측하면 어노테이터는 틀린 부분만 교정하고, 교정된 데이터가 모델 재학습에 투입됩니다. 재학습된 모델은 어노테이션 속도를 다시 높여(최종적으로 초기 대비 약 8배) 데이터 수집 효율과 모델 품질이 함께 상승하는 플라이휠을 형성합니다.",
    stages: ["모델이 마스클릿|전파·예측", "어노테이터 교정", "SA-V 데이터 축적", "모델 재학습|어노테이션 가속"],
    center: "비디오\n데이터 엔진",
    results: "SA-V: 약 5.1만 비디오 · 64만 마스클릿 규모의 최대 비디오 분할 데이터셋. 기존 대비 3배 적은 상호작용으로 더 높은 정확도, 이미지에서도 SAM보다 6배 빠르고 정확.",
    caption: "SAM 2 데이터 엔진: 모델 예측 → 사람 교정 → 재학습이 반복되며 어노테이션 속도 자체가 가속"
  },

  /* ---------- LLM 자기개선 계보 ---------- */
  "star": {
    theme: "llm", short: "STaR", sub: "자가 부트스트랩 추론 학습",
    title: "STaR: Bootstrapping Reasoning With Reasoning",
    date: "2022-03", arxivId: "2203.14465",
    meta: "Zelikman et al. (Stanford) · NeurIPS 2022 · arXiv 2203.14465",
    venue: "NeurIPS 2022",
    citeTier: "1,500+",

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function themeColor(t) { return `var(${THEMES[t].cssVar})`; }
function svgText(parent, x, y, cls, str, style) {
  const t = el("text", { x, y, "text-anchor": "middle", class: cls || "" }, parent);
  if (style) t.setAttribute("style", style);
  t.textContent = str;
  return t;
}

    b.innerHTML = `<span class="ln dash"></span>주제 · 개념 연관`;
    box.appendChild(a); box.appendChild(b);
  }
}

function buildGraph() {
  const svg = $("relgraph");
  const defs = el("defs", {}, svg);
  const mk = el("marker", { id: "g-arrow", viewBox: "0 0 10 10", refX: 9, refY: 5,
    markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 z", style: "fill:var(--text-muted)" }, mk);

  // cluster hulls
  for (const h of RG.hulls) {
    const g = el("g", { style: "pointer-events:none" }, svg);
    el("rect", { x: h.x, y: h.y, width: h.w, height: h.h, rx: 18,
      style: `fill:color-mix(in srgb, ${themeColor(h.theme)} 6%, transparent); stroke:color-mix(in srgb, ${themeColor(h.theme)} 45%, transparent); stroke-width:1; stroke-dasharray:none` }, g);
    const t = svgText(g, 0, 0, "", THEMES[h.theme].label,
      "font-size:12.5px; font-weight:700; fill:var(--text-secondary);");
    t.setAttribute("x", h.x + 14); t.setAttribute("y", h.y + 22);
    t.setAttribute("text-anchor", "start");
  }

  // edges
  const R = 13;
  for (const e of EDGES) {
    const a = RG.nodes[e.from], b = RG.nodes[e.to];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len;
    const x1 = a.x + ux * (R + 4), y1 = a.y + uy * (R + 4);
    const x2 = b.x - ux * (R + 10), y2 = b.y - uy * (R + 10);
    const mx = (x1 + x2) / 2 - uy * 24, my = (y1 + y2) / 2 + ux * 24;
    const p = el("path", {
      d: `M${x1},${y1} Q${mx},${my} ${x2},${y2}`,
      fill: "none",
      stroke: e.kind === "cite" ? "var(--text-secondary)" : "var(--text-muted)",
      "stroke-width": e.kind === "cite" ? 2.2 : 1.6,
      opacity: e.kind === "cite" ? 0.9 : 0.65,
      "marker-end": "url(#g-arrow)"
    }, svg);
    if (e.kind === "concept") p.setAttribute("stroke-dasharray", "6 5");
    const title = el("title", {}, p);
    title.textContent = `${PAPERS[e.from].short} → ${PAPERS[e.to].short}: ${e.note}`;
  }

  // nodes
  for (const id in RG.nodes) {
    const n = RG.nodes[id], d = PAPERS[id];
    const g = el("g", { class: "gnode", role: "button", tabindex: 0,
      "data-paper": id, "aria-label": d.title + " — 상세 보기" }, svg);
    el("circle", { cx: n.x, cy: n.y, r: 16,
      style: "fill:var(--surface-1)" }, g);
    el("circle", { class: "core", cx: n.x, cy: n.y, r: 13,
      style: `fill:color-mix(in srgb, ${themeColor(d.theme)} 30%, var(--surface-1)); stroke:${themeColor(d.theme)}; stroke-width:2.5` }, g);
    const lbl = svgText(g, n.x, n.y + 34, "", d.short,
      "font-size:13px; font-weight:650; fill:var(--text-primary);");
    const sub = svgText(g, n.x, n.y + 50, "", d.date.slice(0, 4),
      "font-size:11px; fill:var(--text-muted);");
    // 투명 히트 타깃: 원·라벨·간극 전체를 클릭 가능하게
    el("rect", { x: n.x - 80, y: n.y - 22, width: 160, height: 80,
      style: "fill:transparent; pointer-events:all" }, g);
    const title = el("title", {}, g);
    title.textContent = d.title;
  }
}

/* =========================================================
   순환 다이어그램 생성기
   ========================================================= */
function cycleDiagram(stages, colorVar, centerLabel) {
  const W = 760, H = 430, cx = W / 2, cy = H / 2;
  const rx = 268, ry = 148;
  const n = stages.length;
  const boxW = 172, boxH = 52;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "플라이휠 순환 구조: " + stages.map(s => s.replace("|", " ")).join(" → ") + " → (반복)");

  const defs = el("defs", {}, svg);
  const mk = el("marker", { id: "arrow-head", viewBox: "0 0 10 10", refX: 8, refY: 5,
    markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 z", fill: `var(${colorVar})` }, mk);

  const pos = [];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    pos.push({ x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a), a });
  }
  for (let i = 0; i < n; i++) {
    const a1 = pos[i].a, a2 = pos[(i + 1) % n].a;
    const trim = 0.34;
    const start = a1 + trim;
    let end = a2 - trim;
    if (end < start) end += 2 * Math.PI;
    const steps = 14;
    let d = "";
    for (let s = 0; s <= steps; s++) {
      const t = start + ((end - start) * s) / steps;
      d += (s === 0 ? "M" : "L") + (cx + rx * Math.cos(t)).toFixed(1) + "," + (cy + ry * Math.sin(t)).toFixed(1);
    }
    el("path", { d, fill: "none", stroke: `var(${colorVar})`, "stroke-width": 2,
      opacity: 0.75, "marker-end": "url(#arrow-head)" }, svg);
  }
  const cLines = centerLabel.split("\n");
  const cg = el("g", {}, svg);
  el("circle", { cx, cy, r: 56,
    fill: `color-mix(in srgb, var(${colorVar}) 10%, var(--surface-1))`,
    stroke: `var(${colorVar})`, "stroke-width": 1.5 }, cg);
  cLines.forEach((ln, i) => {
    svgText(cg, cx, cy + (i - (cLines.length - 1) / 2) * 19 + 5, "", ln,
      "font-size:15px; font-weight:700; fill:var(--text-primary);");
  });
  pos.forEach((p, i) => {
    const lines = stages[i].split("|");
    const g = el("g", {}, svg);
    el("rect", { x: p.x - boxW / 2, y: p.y - boxH / 2, width: boxW, height: boxH, rx: 10,
      fill: `color-mix(in srgb, var(${colorVar}) 8%, var(--surface-1))`,
      stroke: `var(${colorVar})`, "stroke-width": 1.5 }, g);
    lines.forEach((ln, j) => {
      svgText(g, p.x, p.y + (j - (lines.length - 1) / 2) * 16 + 4.5, "", ln,
        `font-size:${j === 0 ? 13 : 11.5}px; font-weight:${j === 0 ? 650 : 400}; fill:var(${j === 0 ? "--text-primary" : "--text-secondary"});`);
    });
    el("circle", { cx: p.x - boxW / 2 + 1, cy: p.y - boxH / 2 + 1, r: 11, fill: `var(${colorVar})` }, g);
    svgText(g, p.x - boxW / 2 + 1, p.y - boxH / 2 + 5, "", String(i + 1),
      "font-size:11px; font-weight:700; fill:#ffffff;");
  });
  return svg;
}

/* =========================================================
   모달
   ========================================================= */
const overlay = $("overlay");
let lastFocus = null;

function openPaper(id) {
  const p = PAPERS[id];
  if (!p) return;
  const th = THEMES[p.theme];
  $("m-dot").style.background = themeColor(p.theme);
  $("m-branch").textContent = th.label;
  $("m-title").textContent = p.title;
  $("m-meta").textContent = p.meta;
  const links = $("m-links");
  links.innerHTML = "";
  const mkLink = (href, label) => {
    const a = document.createElement("a");
    a.href = href; a.target = "_blank"; a.rel = "noopener";
    a.textContent = label;
    links.appendChild(a);
  };
  mkLink(`https://arxiv.org/abs/${p.arxivId}`, "arXiv에서 논문 보기 ↗");
  mkLink(`https://api.semanticscholar.org/arXiv:${p.arxivId}`, "Semantic Scholar (인용 확인) ↗");
  $("m-metric").innerHTML =
    `게재: <b>${p.venue}</b> &nbsp;·&nbsp; 인용 지표: <b>${p.citeTier}</b>` +
    `<div style="margin-top:6px">${p.evidence}</div>` +
    `<div class="metric-note">${CITE_NOTE}</div>`;
  $("m-summary").textContent = p.summary;
  $("m-arch").textContent = p.arch;
  $("m-results").textContent = p.results;
  $("m-caption").textContent = p.caption;
  const holder = $("m-diagram");
  holder.innerHTML = "";
  holder.appendChild(cycleDiagram(p.stages, THEMES[p.theme].cssVar, p.center));
  lastFocus = document.activeElement;
  overlay.classList.add("open");
  $("m-close").focus();
  document.body.style.overflow = "hidden";
}
function closeModal() {
  overlay.classList.remove("open");
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-paper]");
  if (t) openPaper(t.dataset.paper);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest("[data-paper]")) {
    e.preventDefault();
    openPaper(e.target.closest("[data-paper]").dataset.paper);
  }
  if (e.key === "Escape" && overlay.classList.contains("open")) closeModal();
});
$("m-close").addEventListener("click", e => { e.stopPropagation(); closeModal(); });
overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });

/* =========================================================
   탭 전환

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.setAttribute("aria-selected", b === btn ? "true" : "false"));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === btn.dataset.panel));
  });
});
